<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UPark Sync</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--page:#e9edf3;--navy:#0f2a4a;--navy2:#1b3d66;--gold:#d4af37;--ink:#14213a;--mute:#6b7a90;--line:#e3e8f0;--bg:#f6f8fb;--free:#1f9d62;--few:#e59a1a;--full:#d64545;--me:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b1423}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
.phone{width:390px;height:780px;max-height:100%;background:var(--bg);border-radius:36px;border:8px solid #0a1220;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (max-width:480px){.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
header{background:var(--navy);color:#fff;padding:18px 18px 16px}
header .row{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;font-weight:800;letter-spacing:.2px}
h1 span{color:var(--gold)}
.live{font-size:11px;display:flex;align-items:center;gap:6px;color:#cfe0f5}
.live i{width:8px;height:8px;border-radius:50%;background:#3ddc97;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.total{margin-top:12px;display:flex;align-items:baseline;gap:8px}
.total b{font-size:34px;color:var(--gold);font-weight:800}
.total span{font-size:13px;color:#cfe0f5}
main{flex:1;overflow-y:auto;padding:16px}
h2{font-size:15px;font-weight:800;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile small{color:var(--mute);font-size:11px}
.tile .n{font-size:26px;font-weight:800;margin:4px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.entrance{grid-column:1/-1;background:var(--navy2);color:#fff;border-radius:14px;padding:10px;text-align:center;font-size:12px;font-weight:600}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0}
.slot{aspect-ratio:1/1.35;border-radius:6px;border:0;font:600 9px inherit;font-family:inherit;color:#fff;cursor:pointer}
.slot.f{background:var(--free)}.slot.t{background:#c9d1dd;color:#8794a8;cursor:not-allowed}.slot.sel{background:var(--me);outline:3px solid var(--gold)}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font:800 14px inherit;font-family:inherit;background:var(--navy);color:#fff;cursor:pointer;margin-top:10px}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{background:none;border:0;color:var(--navy2);font:600 13px inherit;font-family:inherit;cursor:pointer;margin-bottom:8px;padding:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card p{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.45}
.big{font-size:24px;font-weight:800}
.plate{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:6px 16px;font-size:24px;font-weight:800;letter-spacing:3px}
.steps{list-style:none;padding:0}.steps li{padding:9px 0;border-top:1px solid var(--line);font-size:13px;display:flex;gap:10px}
.steps li:first-child{border:0}
.empty{text-align:center;padding:40px 10px;color:var(--mute);font-size:14px;line-height:1.5}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:11px 0;font:600 11px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
nav b{display:block;font-size:18px;margin-bottom:2px}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
svg{width:100%;height:auto;border-radius:14px;background:#e8eef6}
.path{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.path{animation:none}}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="row"><h1>UPark <span>Sync</span></h1><div class="live"><i></i>Live · updated just now</div></div>
    <div class="total"><b id="tot">32</b><span>of 200 spots free on campus</span></div>
  </header>
  <main id="app"></main>
  <nav>
    <button data-t="map" onclick="go('map')"><b>🗺️</b>Map</button>
    <button data-t="nav" onclick="go('nav')"><b>🧭</b>Navigate</button>
    <button data-t="car" onclick="go('car')"><b>🚗</b>My car</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
const FREE={A:4,B:9,C:0,D:11,E:8},CAP=40;
const S={tab:'map',block:null,slot:null,parked:null};
const cache={};
function slots(b){
  if(cache[b])return cache[b];
  const a=Array(CAP).fill(0),idx=[...Array(CAP).keys()];let s=b.charCodeAt(0)*7;
  for(let i=CAP-1;i>0;i--){s=(s*9301+49297)%233280;const j=s%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}
  idx.slice(0,FREE[b]).forEach(i=>a[i]=1);return cache[b]=a;
}
const col=n=>n===0?'var(--full)':n<=5?'var(--few)':'var(--free)';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function go(t){S.tab=t;if(t==='map')S.block=null;draw()}
function openBlock(b){S.block=b;S.tab='map';draw()}
function pick(i){S.slot=i;draw()}
function start(){S.tab='nav';draw()}
function park(){
  const d=new Date();
  S.parked={block:S.block,slot:S.slot,time:d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};
  FREE[S.block]=Math.max(0,FREE[S.block]-1);cache[S.block][S.slot]=0;
  document.getElementById('tot').textContent=Object.values(FREE).reduce((a,b)=>a+b,0);
  S.tab='car';S.block=null;S.slot=null;draw();toast('Saved. Your car is marked.');
}
function views(){
  if(S.tab==='map'&&!S.block){
    return `<h2>Choose a parking block</h2><div class="grid">`+
    Object.keys(FREE).map(b=>`<button class="tile" onclick="openBlock('${b}')" aria-label="Block ${b}, ${FREE[b]} spots free"><small>Block ${b}</small><div class="n" style="color:${col(FREE[b])}">${FREE[b]}</div><small>free of ${CAP}</small><div class="bar" style="margin-top:8px"><i style="width:${FREE[b]/CAP*100}%;background:${col(FREE[b])}"></i></div></button>`).join('')+
    `<div class="entrance">Main entrance · plate recognised on entry</div></div>
    <div class="legend"><span><i style="background:var(--free)"></i>Plenty</span><span><i style="background:var(--few)"></i>Few left</span><span><i style="background:var(--full)"></i>Full</span></div>`;
  }
  if(S.tab==='map'){
    const b=S.block,a=slots(b);
    return `<button class="back" onclick="go('map')">‹ All blocks</button><h2>Block ${b} · ${FREE[b]} free</h2>
    <div class="card" style="padding:12px"><div class="slots">`+
    a.map((f,i)=>`<button class="slot ${S.slot===i?'sel':f?'f':'t'}" ${f?'':'disabled'} onclick="pick(${i})" aria-label="Slot ${b}-${i+1} ${f?'free':'taken'}">${i+1}</button>`).join('')+
    `</div><div class="legend" style="margin:0"><span><i style="background:var(--free)"></i>Free</span><span><i style="background:#c9d1dd"></i>Taken</span><span><i style="background:var(--me)"></i>Selected</span></div></div>
    <p style="font-size:12px;color:var(--mute)">Estimated walk to Block ${b} entrance: ${3+('ABCDE'.indexOf(b))} min</p>
    <button class="btn gold" ${S.slot===null?'disabled':''} onclick="start()">${S.slot===null?'Select a free slot':'Navigate to '+b+'-'+(S.slot+1)}</button>`;
  }
  if(S.tab==='nav'){
    if(S.slot===null)return `<div class="empty">No destination yet.<br>Pick a free slot on the map first.<button class="btn" onclick="go('map')">Open map</button></div>`;
    const lbl=S.block+'-'+(S.slot+1);
    return `<h2>Heading to ${lbl}</h2>
    <svg viewBox="0 0 340 230" role="img" aria-label="Route from main entrance to slot ${lbl}">
      <rect x="20" y="20" width="120" height="70" rx="8" fill="#fff"/><rect x="200" y="20" width="120" height="70" rx="8" fill="#fff"/>
      <rect x="20" y="130" width="120" height="70" rx="8" fill="#fff"/><rect x="200" y="130" width="120" height="70" rx="8" fill="#fff"/>
      <text x="80" y="60" text-anchor="middle" font-size="12" fill="#6b7a90">Block A</text><text x="260" y="60" text-anchor="middle" font-size="12" fill="#6b7a90">Block B</text>
      <text x="80" y="170" text-anchor="middle" font-size="12" fill="#6b7a90">Block C</text><text x="260" y="170" text-anchor="middle" font-size="12" fill="#6b7a90">Block D</text>
      <path class="path" d="M170 225 V110 H260 V92" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <circle cx="170" cy="222" r="7" fill="#0f2a4a"/><circle cx="260" cy="90" r="9" fill="#2563eb" stroke="#d4af37" stroke-width="3"/>
    </svg>
    <div class="card" style="margin-top:12px"><div class="big">3 min <span style="font-size:13px;color:var(--mute);font-weight:600">· 240 m</span></div>
    <ul class="steps"><li>1 Enter via the main gate</li><li>2 Continue straight past the junction</li><li>3 Turn right, slot ${lbl} is on your left</li></ul></div>
    <button class="btn gold" onclick="park()">I’ve parked here</button>`;
  }
  if(!S.parked)return `<div class="empty">No car marked yet.<br>When you park, tap “I’ve parked here” and we’ll remember the spot.<button class="btn" onclick="go('map')">Find a spot</button></div>`;
  const p=S.parked;
  return `<h2>Mark my car</h2><div class="card" style="text-align:center"><span class="plate">ABC 1234</span>
  <p style="margin-top:12px">Parked at</p><div class="big">Block ${p.block} · Slot ${p.slot+1}</div><p>Since ${p.time} · 180 m from the main entrance</p></div>
  <button class="btn gold" onclick="toast('Walking route to ${p.block}-${p.slot+1} · 3 min')">Find my car</button>
  <button class="btn ghost" onclick="S.parked=null;draw();toast('Mark cleared')">Clear mark</button>`;
}
function draw(){
  document.getElementById('app').innerHTML=views();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  document.getElementById('app').scrollTop=0;
}
draw();
</script>
</body>
</html>
